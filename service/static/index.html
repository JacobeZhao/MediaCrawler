<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>小皮爬虫服务</title>
  <link rel="icon" type="image/svg+xml" href="/static/crawler-logo.svg?v=20261009-4">
  <link rel="stylesheet" href="/static/styles.css?v=20261009-7">
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="topbar-inner">
      <div class="brand">
        <img class="brand-logo" src="/static/crawler-logo.svg?v=20261009-4" alt="" width="34" height="34">
        <div class="brand-title">小皮爬虫服务</div>
      </div>
      <div class="top-actions">
        <div class="service-status" id="serviceStatus" role="status" aria-live="polite" data-state="loading"><span class="service-status-dot" aria-hidden="true"></span><span id="serviceStatusText">连接中</span></div>
        <button class="btn primary" id="openCreateBtn" type="button">新增任务</button>
        <button class="btn ghost" id="refreshBtn">刷新</button>
      </div>
    </div>
  </header>

  <main class="shell">
    <div id="apiError" class="alert hidden" role="alert"></div>

    <section class="summary-strip" aria-label="服务统计">
      <div class="summary-item"><span class="summary-label">账号健康度</span><strong id="accountHealthValue">-</strong><span class="summary-detail" id="accountHealthDetail">可用 0 / 0</span></div>
      <div class="summary-item"><span class="summary-label">任务总数</span><strong id="taskTotalValue">0</strong><span class="summary-detail">全部任务</span></div>
      <div class="summary-item"><span class="summary-label">已完成</span><strong id="taskCompletedValue">0</strong><span class="summary-detail">完成状态</span></div>
      <div class="summary-item"><span class="summary-label">任务完成率</span><strong id="taskCompletionValue">-</strong><span class="summary-detail">已完成 / 总数</span></div>
    </section>

    <section class="layout">
      <aside class="panel account-panel">
        <div class="panel-head">
          <div class="row account-actions">
            <button class="btn ghost small" id="candidateBtn">候选账号</button>
            <button class="btn primary small" id="healthBtn">健康检查</button>
            <button class="btn ghost small" id="openCookieBtn">添加 Cookie</button>
            <button class="btn ghost small" id="qrBtn">二维码登录</button>
          </div>
        </div>
        <div class="panel-body">
          <div class="account-list" id="accountList"></div>
        </div>
      </aside>

      <section class="workspace-panel" aria-label="任务列表">
        <div class="panel-head">
          <div class="task-toolbar">
            <div class="task-bulk">
              <label class="small-text select-visible-label" for="selectVisibleTasks"><input type="checkbox" id="selectVisibleTasks"> 全选</label>
              <span class="small-text muted selection-count" id="selectionCount">已选 0 项</span>
              <button class="btn ghost" id="exportBtn" disabled>导出 Excel</button>
              <button class="btn danger" id="deleteTasksBtn" disabled>删除</button>
              <select class="select task-status-filter" id="taskStatusFilter" aria-label="筛选任务状态">
                <option value="">全部状态</option>
                <option value="running">运行中</option>
                <option value="pending">等待中</option>
                <option value="paused">已暂停</option>
                <option value="failed">失败</option>
                <option value="completed">完成</option>
              </select>
            </div>
          </div>
        </div>
        <div class="task-list" id="taskRows" role="list" aria-label="任务执行列表"></div>
      </section>

      <div class="modal" id="createTaskModal" role="dialog" aria-modal="true" aria-labelledby="createTaskModalTitle">
        <div class="modal-card create-modal-card">
          <div class="panel-head">
            <div>
              <h2 class="panel-title" id="createTaskModalTitle">创建任务</h2>
            </div>
            <button class="btn ghost small" type="button" data-close="createTaskModal">关闭</button>
          </div>
          <div class="panel-body">
            <div class="tabs task-type-tabs" role="tablist" aria-label="任务类型">
              <button class="tab active" type="button" role="tab" aria-selected="true" data-task-type="search">搜索词</button>
              <button class="tab" type="button" role="tab" aria-selected="false" data-task-type="creator">博主</button>
              <button class="tab" type="button" role="tab" aria-selected="false" data-task-type="note">笔记</button>
            </div>
            <div class="mode-tabs mt-sm" role="tablist" aria-label="任务模式">
              <button class="mode-tab active" type="button" role="tab" aria-selected="true" data-task-mode="single">单个</button>
              <button class="mode-tab" type="button" role="tab" aria-selected="false" data-task-mode="batch">批量</button>
            </div>

            <div class="provider-picker mt-sm">
              <div class="row-between">
                <span class="label">执行方式</span>
                <span id="providerReadiness" class="pill neutral">状态加载中</span>
              </div>
              <div class="provider-tabs mt-xs" role="radiogroup" aria-label="执行方式">
                <button class="provider-tab active" type="button" data-task-provider="local" role="radio" aria-checked="true">本地爬虫</button>
                <button class="provider-tab" type="button" data-task-provider="justoneapi" role="radio" aria-checked="false">JustOneAPI</button>
              </div>
            </div>

            <div id="justoneApiOptions" class="provider-options hidden mt-sm">
              <div class="row-between">
                <span class="label">JustOneAPI 选项</span>
                <span class="small-text muted">请求限制</span>
              </div>
              <div class="form-grid mt-xs">
                <div class="field"><label class="label" for="justoneMaxPages">最多页数</label><input class="input" id="justoneMaxPages" type="number" min="1" max="100" value="3"></div>
                <div class="field"><label class="label" for="justoneMaxRequests">最多请求</label><input class="input" id="justoneMaxRequests" type="number" min="1" max="1000" value="20"></div>
                <div class="field"><label class="label" for="justoneNoteType">笔记类型</label><select class="select" id="justoneNoteType"><option value="ALL">全部</option><option value="NORMAL_NOTE">图文</option><option value="VIDEO_NOTE">视频</option></select></div>
                <div class="field"><label class="label" for="justoneTimeFilter">时间范围</label><select class="select" id="justoneTimeFilter"><option value="ALL" selected>不限</option><option value="ONE_DAY">一天内</option><option value="ONE_WEEK">一周内</option><option value="HALF_YEAR">半年内</option></select></div>
              </div>
              <div class="provider-checks mt-sm">
                <label class="check-option"><input type="checkbox" id="justoneIncludeDetails" checked> 笔记详情</label>
                <label class="check-option"><input type="checkbox" id="justoneIncludeComments"> 评论</label>
                <label class="check-option"><input type="checkbox" id="justoneIncludeReplies" disabled> 回复</label>
              </div>
            </div>

            <form id="searchSingleForm" class="task-form mt-md" data-task-form="search-single">
              <div class="field"><label class="label">关键词</label><input class="input" name="keyword" placeholder="例如：宝宝面条" required></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">笔记数</label><input class="input" name="max_notes" type="number" min="1" max="500" value="20"></div>
                <div class="field"><label class="label">每篇评论</label><input class="input" name="max_comments" type="number" min="0" max="10000" value="10000"></div>
                <div class="field"><label class="label">排序</label><select class="select" name="sort_type"><option value="popularity_descending">热度</option><option value="time_descending">最新</option><option value="general">默认</option></select></div>
                <div class="field" data-local-only><label class="label">天数限制</label><input class="input" name="days_limit" type="number" min="0" value="30"></div>
              </div>
              <label class="row small-text mt-sm"><input type="checkbox" name="force"> 强制重爬</label>
              <button class="btn primary full-width mt-md">提交搜索任务</button>
            </form>

            <form id="searchBatchForm" class="task-form hidden mt-md" data-task-form="search-batch">
              <div class="field"><label class="label">关键词列表</label><textarea class="textarea" name="keywords" placeholder="每行一个关键词"></textarea></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">笔记数</label><input class="input" name="max_notes" type="number" min="1" max="500" value="20"></div>
                <div class="field"><label class="label">每篇评论</label><input class="input" name="max_comments" type="number" min="0" max="10000" value="10000"></div>
                <div class="field"><label class="label">排序</label><select class="select" name="sort_type"><option value="popularity_descending">热度</option><option value="time_descending">最新</option><option value="general">默认</option></select></div>
                <div class="field" data-local-only><label class="label">天数限制</label><input class="input" name="days_limit" type="number" min="0" value="30"></div>
              </div>
              <button class="btn primary full-width mt-md">提交批量搜索</button>
            </form>

            <form id="creatorSingleForm" class="task-form hidden mt-md" data-task-form="creator-single">
              <div class="field"><label class="label">博主主页或用户 ID</label><input class="input" name="creator_input" required></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">笔记数</label><input class="input" name="max_notes" type="number" min="1" max="500" value="20"></div>
                <label class="row small-text align-end"><input type="checkbox" name="force"> 强制重爬</label>
              </div>
              <button class="btn blue full-width mt-md">提交博主任务</button>
            </form>

            <form id="creatorBatchForm" class="task-form hidden mt-md" data-task-form="creator-batch">
              <div class="field"><label class="label">博主列表</label><textarea class="textarea" name="creator_urls" placeholder="每行一个博主主页或用户 ID"></textarea></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">笔记数</label><input class="input" name="max_notes" type="number" min="1" max="500" value="20"></div>
              </div>
              <button class="btn blue full-width mt-md">提交批量博主</button>
            </form>

            <form id="noteSingleForm" class="task-form hidden mt-md" data-task-form="note-single">
              <div class="field"><label class="label">笔记链接或 ID</label><input class="input" name="note_input" placeholder="粘贴单篇笔记链接或 ID" required></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">D 分层</label><input class="input" name="d_level" value="D1"></div>
                <div class="field"><label class="label">质量</label><input class="input" name="quality" value="未标注"></div>
              </div>
              <button class="btn dark full-width mt-md">提交笔记任务</button>
            </form>

            <form id="noteBatchForm" class="task-form hidden mt-md" data-task-form="note-batch">
              <div class="field"><label class="label">笔记列表</label><textarea class="textarea" name="inputs" placeholder="每行一个笔记链接或 ID"></textarea></div>
              <div class="form-grid mt-sm">
                <div class="field"><label class="label">D 分层</label><input class="input" name="d_level" value="D1"></div>
                <div class="field"><label class="label">质量</label><input class="input" name="quality" value="未标注"></div>
              </div>
              <button class="btn dark full-width mt-md">提交批量笔记</button>
            </form>
          </div>
        </div>
      </div>
    </section>
  </main>
</div>

<div class="task-drawer" id="taskDetailDrawer" role="dialog" aria-modal="true" aria-labelledby="taskDetailTitle">
  <div class="task-drawer-card">
    <div class="task-drawer-head">
      <div><b id="taskDetailTitle">任务详情</b><div class="small-text muted" id="taskDetailStatus">选择任务查看详情</div></div>
      <button class="btn ghost small" type="button" id="closeTaskDetailBtn">关闭</button>
    </div>
    <div class="task-drawer-body" id="taskDetailBody"><div class="empty">尚未选择任务</div></div>
  </div>
</div>

<div class="toast-region" id="toastRegion" aria-live="polite" aria-atomic="true"></div>

<div class="modal" id="candidateModal" role="dialog" aria-modal="true" aria-labelledby="candidateModalTitle">
  <div class="modal-card candidate-modal-card">
    <div class="modal-head">
      <b id="candidateModalTitle">候选账号信息</b>
      <button class="btn ghost small" data-close="candidateModal">关闭</button>
    </div>
    <div class="modal-body">
      <div class="candidate-tools">
        <div class="muted small-text">这些账号只作为登录候选，不会自动加入爬虫账号池。</div>
        <button class="btn ghost small" id="reloadCandidatesBtn">刷新候选</button>
      </div>
      <div class="candidate-list mt-md" id="candidateList"></div>
    </div>
  </div>
</div>

<div class="modal" id="cookieModal" role="dialog" aria-modal="true" aria-labelledby="cookieModalTitle">
  <div class="modal-card">
    <div class="modal-head">
      <b id="cookieModalTitle">添加 Cookie</b>
      <button class="btn ghost small" data-close="cookieModal">关闭</button>
    </div>
    <div class="modal-body">
      <div class="field"><label class="label">账号备注</label><input class="input" id="accountName" placeholder="例如：账号-1"></div>
      <div class="field mt-md"><label class="label">Cookie</label><textarea class="textarea cookie-textarea" id="accountCookie"></textarea></div>
      <button class="btn primary full-width mt-md" id="saveCookieBtn">保存并验证</button>
    </div>
  </div>
</div>

<div class="modal" id="qrModal" role="dialog" aria-modal="true" aria-labelledby="qrModalTitle">
  <div class="modal-card qr-modal-card">
    <div class="modal-head">
      <b id="qrModalTitle">二维码登录</b>
      <button class="btn ghost small" id="closeQrBtn">关闭</button>
    </div>
    <div class="modal-body">
      <div class="field"><label class="label">账号备注</label><input class="input" id="qrAccountName" value="new-account"></div>
      <button class="btn primary full-width mt-md" id="startQrBtn">生成二维码</button>
      <img id="qrImage" class="qr-img hidden" alt="登录二维码">
      <div class="muted small-text text-center" id="qrMessage">生成后请扫码确认登录</div>
    </div>
  </div>
</div>

  <script src="/static/app.js?v=20261009-8"></script>

</body>
</html>
